<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Database Alumni D1</title>
<style>
:root{--ink:#172033;--mut:#667085;--line:#e6eaf2;--pri:#1f3a8a;--priSoft:#eaf0ff;--ok:#12a150;--okSoft:#e3f7ec;--warn:#b54708;--warnSoft:#fff1dc;--bad:#b42318;--badSoft:#fde7e5;--card:#fff}
*{box-sizing:border-box}
body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;color:var(--ink);background:linear-gradient(180deg,#dce7fa 0,#f5f7fb 360px) fixed}
.wrap{max-width:1240px;margin:auto;padding:18px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.badge{width:44px;height:44px;border-radius:12px;background:#1b2440;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.head h1{font-size:20px;margin:0}.head .sub{font-size:12px;color:var(--mut)}
.head .sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:#fff;border:1px solid var(--line);padding:8px 12px;font-size:13px}.btn:hover{background:#f3f6fc}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 12px #1b244014}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stat{text-align:left;padding:16px;border:2px solid transparent;transition:.15s}
.stat:hover{transform:translateY(-2px)}
.stat.on{border-color:var(--pri);background:#f6f8ff}
.stat .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.stat .n{font-size:30px;font-weight:700;margin:4px 0 2px}
.stat .d{font-size:12px;color:var(--mut)}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}
.filters label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #9db4f5;border-color:transparent}
.main{display:grid;grid-template-columns:380px 1fr;gap:12px;align-items:start}
.listcard{padding:0;overflow:hidden;position:sticky;top:10px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.lh span{font-weight:500;color:var(--mut);font-size:13px}
.list{max-height:calc(100vh - 150px);overflow:auto}
.person{display:block;width:100%;text-align:left;background:#fff;padding:11px 16px;border-bottom:1px solid #f0f2f7;border-radius:0}
.person:hover{background:#f6f8fd}.person.sel{background:var(--priSoft);box-shadow:inset 3px 0 0 var(--pri)}
.person b{font-size:14px}.person .m{font-size:12px;color:var(--mut);margin-top:2px}
.dots{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:#f0f2f7;color:#475467}
.chip.s{background:#e7f0ff;color:#1d4ed8}.chip.b{background:#fff1dc;color:#b54708}.chip.k{background:#e3f7ec;color:#0b7a3b}.chip.x{background:var(--badSoft);color:var(--bad)}
.more{width:100%;padding:12px;background:#f7f9fd;color:var(--pri);font-weight:600;border-radius:0}
.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.empty .ic{width:60px;height:60px;border-radius:50%;background:#eef1f7;margin:0 auto 10px;display:grid;place-items:center;font-size:26px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.dh h2{margin:0;font-size:22px}.dh .m{color:var(--mut);font-size:13px;margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;background:#f0f2f7}
.tag.warn{background:var(--warnSoft);color:var(--warn);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:#fff}
.tile:hover{border-color:#9db4f5;background:#f7f9ff}
.tile .l{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .n{font-size:20px;font-weight:700;margin-top:3px}.tile .d{font-size:12px;color:var(--mut);margin-top:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tab{background:none;padding:10px 14px;border-radius:10px 10px 0 0;color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}.tab small{margin-left:4px;background:#eef1f7;border-radius:99px;padding:1px 7px;font-size:11px}
.sec{margin-bottom:18px}.sec h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 span{font-weight:500;color:var(--mut);font-size:12px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.mo{border-radius:10px;padding:8px 2px;text-align:center;background:#f3f4f8;color:#98a2b3;font-size:12px;border:1px solid transparent}
.mo.ok{background:var(--okSoft);color:#0b7a3b;border-color:#bfe9d0;font-weight:600;cursor:pointer}
.mo.ok:hover{background:#cdf0dc}
.mo i{display:block;font-style:normal;font-size:10px;margin-top:2px;font-weight:500}
.note{font-size:12px;color:var(--mut);margin-top:8px;min-height:18px}
.bar{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar .t{height:10px;background:#eef1f7;border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;background:linear-gradient(90deg,#3b63d9,#6f93f5);border-radius:99px}
.bar .v{text-align:right;font-weight:600}
.big{font-size:28px;font-weight:700}
.ed{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
.e{aspect-ratio:1;border-radius:7px;background:#f3f4f8;color:#98a2b3;font-size:11px;display:grid;place-items:center;border:1px solid transparent}
.e.ok{background:var(--okSoft);color:#0b7a3b;border-color:#bfe9d0;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}.kv small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okSoft);color:#0b7a3b}.pill.no{background:#f0f2f7;color:#667085}.pill.warn{background:var(--warnSoft);color:var(--warn)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.chart i{display:block;background:linear-gradient(180deg,#6f93f5,#3b63d9);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.chart b{display:block;font-size:11px;color:var(--ink);margin-bottom:2px;height:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:160px}
.fc{background:#f0f2f7;padding:7px 12px;font-size:12px;font-weight:600;color:#475467;border-radius:99px}.fc.on{background:var(--pri);color:#fff}
.ev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;width:100%;text-align:left;display:block}
.ev:hover{background:#f9fafe}.ev .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.ev .t span{font-weight:500;color:var(--mut);font-size:12px}
.ev .b{display:none;margin-top:8px;font-size:13px;color:#475467;line-height:1.5}.ev.open .b{display:block}
.err{background:var(--badSoft);color:var(--bad);padding:14px;border-radius:12px}
.skel{height:56px;border-radius:10px;background:linear-gradient(90deg,#eef1f7,#f7f9fd,#eef1f7);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 16px}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:900px){.stats,.tiles{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters>div:first-child{grid-column:1/3}.main{grid-template-columns:1fr}.listcard{position:static}.list{max-height:340px}.months{grid-template-columns:repeat(6,1fr)}.ed{grid-template-columns:repeat(8,1fr)}.bar{grid-template-columns:100px 1fr 90px}.kv{grid-template-columns:1fr 1fr}}
.hidden{display:none!important}
.vts{display:flex;gap:4px;background:#eef1f7;border-radius:99px;padding:3px}.vt{background:none;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut)}.vt.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table.rk{border-collapse:collapse;width:100%;font-size:13px}table.rk th,table.rk td{padding:8px 9px;text-align:center;border-bottom:1px solid #eef0f5;white-space:nowrap}
table.rk thead th{background:#f7f8fb;color:var(--mut);font-size:12px;position:sticky;top:0}
table.rk th.f{text-align:left;position:sticky;left:0;background:#fff;font-weight:700;z-index:1}table.rk thead th.f{background:#f7f8fb}
table.rk td.c{cursor:pointer}table.rk td.c:hover{outline:2px solid var(--pri);outline-offset:-2px}table.rk td.sel{outline:2px solid #111;outline-offset:-2px}
table.rk td.l{color:var(--mut)}table.rk tr.tot td,table.rk tr.tot th{background:#f0f3fb;font-weight:700}
.rn{font-size:12px;color:var(--mut);margin:10px 0;line-height:1.5}.rw{background:#fff7e0;border:1px solid #f1d58a;border-radius:10px;padding:8px 10px;font-size:12px;margin-top:8px}
.drill{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fafbfe}.drill h4{margin:0 0 8px;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips .chip{font-size:12px;padding:4px 10px}
.lbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.lbar .sp{flex:1}.lbar select{width:auto;min-width:160px}
.xtabs{display:flex;gap:2px;margin-bottom:0}.xt{background:#e4e7ee;padding:7px 18px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:#475467}.xt.on{background:#fff;color:#1d6f42;box-shadow:inset 0 3px 0 #1d6f42}
.xlw{overflow:auto;width:fit-content;max-width:100%;border:1px solid #c9ccd1;background:#fff}
table.xl{border-collapse:collapse;font:12px Calibri,Arial,sans-serif;width:auto}
table.xl th,table.xl td{border:1px solid #d4d7dd;padding:3px 7px;white-space:nowrap;height:22px}
table.xl thead th{position:sticky;top:0;z-index:3;text-align:center;font-weight:700}
table.xl thead tr:nth-child(2) th{top:23px}
table.xl th.band{background:#e8eef8;color:#222;font-size:12px}.band.b1{background:#e6f4ea!important}.band.b2{background:#eaf6e0!important}.band.b3{background:#fff4d6!important}.band.b4{background:#fde9d9!important}.band.b5{background:#e7e6f7!important}
table.xl tr.z td{background:#e2f0d9}table.xl td.vv{background:#c6efce!important;color:#0b7a3b;font-weight:700;text-align:center}
table.xl td.n{text-align:right}table.xl tr.ft td{background:#f3f4f7!important;font-weight:700}
table.xl .fz{position:sticky;z-index:2;background:#fff}table.xl tr.z td.fz{background:#e2f0d9}table.xl thead th.fz{z-index:4}
table.xl .fz0{left:0;min-width:36px;width:36px}table.xl .fz1{left:36px}
body.lockmode .wrap{max-width:100%;padding:8px}body.lockmode{background:#fff}body.lockmode .card{box-shadow:none;border:0;padding:0}
@media print{.lbar,.xtabs,.head,.vts{display:none!important}.xlw{max-height:none;overflow:visible}}
.hidp{background:#fffdf3;border:1px solid #f0e3a8;border-radius:10px;padding:10px 12px;margin:8px 0}.hidp .hl{font-weight:700;font-size:13px;margin-bottom:6px}.hidp .hl small{font-weight:500;color:var(--mut)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#475467;margin-left:8px}.chk input{width:16px;height:16px;flex:none;padding:0}
.sstitle{display:none}
#ssctl{position:fixed;bottom:6px;right:6px;z-index:99;display:flex;gap:4px;opacity:.35}#ssctl:hover{opacity:1}#ssctl button{background:#111;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700}
body.ssmode{background:#fff}body.ssmode .head,body.ssmode .lbar,body.ssmode .xtabs,body.ssmode .hidp,body.ssmode #lbox>.rn{display:none!important}
body.ssmode .wrap{max-width:none;padding:6px}body.ssmode .card{box-shadow:none;border:0;padding:0}
body.ssmode .sstitle{display:block;font:700 15px Calibri,Arial,sans-serif;margin:2px 0 6px;color:#1f2a44}
body.ssmode .xlw{max-height:none!important;overflow:visible;border:0}body.ssmode table.xl thead th,body.ssmode table.xl .fz{position:static}
body.ssmode #vRekap,body.ssmode #vAlumni{display:none!important}
.inform{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.inform .w2{grid-column:span 2}.inform label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:3px}.inform label small{font-weight:500}
.inpick{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px}.pklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;max-height:340px;overflow:auto;margin-top:8px}
.pk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff}.pk.on{background:#e8f5ec;border-color:#7cc79a}.pk input{width:16px;height:16px;flex:none;margin-top:2px;padding:0}.pk b{display:block;font-size:13px}.pk small{color:var(--mut);font-size:11px}
.okm{background:#e8f5ec;border:1px solid #9ed4b2;color:#0b5b2c;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;font-weight:700;padding:10px 20px}.btn.pri:disabled{opacity:.45}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;margin:0!important;color:var(--ink)!important;font-weight:500!important}.chk input{width:16px;height:16px;padding:0;flex:none}
.hint{font-size:11.5px;margin-top:3px;color:var(--mut);min-height:14px}.hint.bad{color:#b4231b;font-weight:600}.hint.ok{color:#0b5b2c}
.pv{background:#f6f8fd;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px}.pv ul{margin:6px 0 0 18px;padding:0}.pv li{margin:3px 0}.pv .w{color:#8a5a00}
.tot{grid-column:span 4;font-size:14px;font-weight:700;padding:8px 12px;background:#eef4ff;border-radius:10px}
@media(max-width:900px){.tot{grid-column:span 2}.inform{grid-template-columns:1fr 1fr}.inform .w2{grid-column:span 2}}

.ms{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;cursor:pointer}.ms:hover{border-color:#b9c4e0}
.ms h4{margin:0 0 4px;font-size:14px;line-height:1.35}.ms .mt{font-size:12px;color:var(--mut)}.ms .fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ms .fl span{background:#eef1f7;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}.ms .fl span b{color:var(--pri)}
.ms .nm{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px;line-height:1.7}.ms .nm i{font-style:normal;color:var(--mut);font-size:11px}

/* ===== MOBILE APP EXPERIENCE — v1 ===== */
@media (max-width:900px){
  :root{--appbar:64px;--bottom:74px}
  html{background:#f5f7fb;-webkit-text-size-adjust:100%}
  body{background:#f5f7fb!important;min-height:100vh;padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom));overflow-x:hidden}
  .wrap{width:100%;max-width:none;padding:0 14px 18px}
  .head{position:sticky;top:0;z-index:40;margin:0 -14px 12px;padding:10px 14px;background:rgba(245,247,251,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,234,242,.8)}
  .badge{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#173d72,#1f5a8a);box-shadow:0 6px 16px rgba(31,58,138,.18)}

  .head .vts{display:none}
  #rf{margin-left:0!important;width:40px;height:40px;padding:0;border-radius:12px;font-size:0;background:#fff;box-shadow:0 2px 8px rgba(23,32,51,.06)}
  #rf:after{content:'↻';font-size:20px;color:var(--pri)}
  .card{border-radius:18px;box-shadow:0 3px 18px rgba(23,32,51,.06);padding:14px}
  #vAlumni>.stats{display:flex;overflow-x:auto;gap:10px;margin:0 -14px 12px;padding:2px 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
  #vAlumni>.stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 154px;min-height:104px;padding:14px;border-radius:17px;scroll-snap-align:start}

  .stat.on{box-shadow:0 4px 14px rgba(31,58,138,.12)}
  .filters{display:block;padding:11px;margin-bottom:12px}
  .filters>div{margin-bottom:9px}.filters>div:last-child{margin-bottom:0}
  .filters label{display:none}
  #q{height:46px;border-radius:14px;padding-left:42px;background:#f7f8fb;border-color:transparent;box-shadow:inset 0 0 0 1px #e8ebf2}
  #q::placeholder{color:#98a2b3}
  .filters:before{content:'⌕';position:absolute;margin:10px 0 0 14px;font-size:22px;color:#667085;z-index:1}
  .filters{position:relative}
  .filters select{height:40px;border-radius:12px;font-size:13px;background:#f7f8fb;border-color:transparent}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filters>div:first-child{grid-column:1/3;margin-bottom:1px}
  .main{display:flex;flex-direction:column;gap:10px}
  .listcard{order:1;position:static;padding:0;border-radius:18px;overflow:hidden}
  .lh{padding:13px 14px;font-size:14px}.lh span{font-size:12px}
  .list{max-height:none;overflow:visible}
  .person{padding:14px;border-bottom:1px solid #f0f2f7;min-height:78px;transition:background .15s}
  .person:active{background:#f1f5ff}.person.sel{box-shadow:inset 3px 0 0 var(--pri)}
  .person b{font-size:13.5px;line-height:1.3}.person .m{font-size:11px;line-height:1.4;margin-top:4px}
  .dots{gap:4px;margin-top:7px}.chip{font-size:10px;padding:3px 7px}
  .more{padding:14px;font-size:13px}
  #detail{order:2;min-height:200px;padding:15px}
  .dh h2{font-size:19px;line-height:1.25}.dh .m{font-size:11.5px;line-height:1.45}
  .tags{gap:5px}.tag{font-size:10.5px;padding:4px 8px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
  .tile{padding:12px;border-radius:14px;min-height:90px}.tile .l{font-size:9.5px}.tile .n{font-size:18px}.tile .d{font-size:10.5px;line-height:1.3}
  .tabs{gap:4px;margin:0 -2px 12px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}.tab{font-size:12px;padding:9px 11px;flex:none}
  .kv{grid-template-columns:1fr 1fr;gap:7px}.kv div{padding:9px;border-radius:12px;font-size:11.5px;overflow-wrap:anywhere}.kv small{font-size:9px}
  .months{grid-template-columns:repeat(4,1fr);gap:6px}.mo{padding:9px 2px;border-radius:11px;font-size:11px}.mo i{font-size:9px}
  .ed{grid-template-columns:repeat(8,1fr);gap:4px}.e{font-size:10px;border-radius:6px}
  .bar{grid-template-columns:82px 1fr 82px;gap:6px;font-size:11px}.bar .v{font-size:11px}
  .chart{gap:3px;height:105px}.chart b{font-size:9px}.chart div{font-size:9px}.chart i{border-radius:5px 5px 0 0}
  .tools{gap:5px;margin-bottom:8px}.tools input{min-width:120px;height:40px}.fc{font-size:10.5px;padding:7px 9px}
  .ev{padding:11px;border-radius:13px;margin-bottom:7px}.ev .t{font-size:11.5px}.ev .t span{font-size:10px}.ev .b{font-size:11.5px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script>
var LOCK=<?!= lockJson ?>;
var PIN="";try{PIN=sessionStorage.getItem("pin")||""}catch(e){}
var A=[],C={},cur=null,tabNow='ring',F='all',PAGE=60,page=1,evFilter='Semua',evQ='';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function rp(n){return 'Rp '+String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function load(){
  $('rf').disabled=true;$('rf').textContent='Memuat…';
  $('list').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  google.script.run.withSuccessHandler(function(d){
    A=Array.isArray(d.alumni)?d.alumni:[];C=d.counts||{};REK=d.rekap||{};LEM=d.lembar||{};
    $('nA').textContent=C.alumni;$('nS').textContent=C.spp;$('nB').textContent=C.buletin;$('nK').textContent=C.kehadiran;
    $('dS').textContent=(C.sppTransaksi||0)+' transaksi dari sumber SPP/Infaq';
    $('dK').textContent=(C.kehadiranEvent||0)+' event pada Database_SM';
    fillSel('fF','Semua FUPPI','fuppi');fillSel('fS','Semua Sekolah','sekolah');fillSel('fT','Semua Tingkat','tingkat');fillSel('fK','Semua Kelas','kelas');
    $('rf').disabled=false;$('rf').textContent='↻ Muat ulang';
    resetPage();renderList();initRekap();initLembar();
    if(cur){var k=cur.key;cur=null;var f=A.filter(function(x){return x.key===k})[0];if(f)openP(f.key)}
  }).withFailureHandler(function(e){
    if(e&&/PIN/.test(e.message||'')){var p=prompt(PIN?'PIN salah. Masukkan PIN admin:':'Masukkan PIN admin:');if(p!==null){PIN=p;try{sessionStorage.setItem('pin',p)}catch(x){}return load()}}
    $('rf').disabled=false;$('rf').textContent='↻ Coba lagi';
    $('list').innerHTML='<div class="err" style="margin:14px">Gagal memuat data: '+esc(e&&e.message?e.message:e)+'</div>';
  }).getDashboard(PIN);
}
function fillSel(id,label,key){
  var cur0=$(id).value;var v={};A.forEach(function(x){if(x[key])v[x[key]]=1});
  var o=Object.keys(v).sort();
  $(id).innerHTML='<option value="">'+label+'</option>'+o.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
  $(id).value=cur0;
}
function setF(f){F=(F===f&&f!=='all')?'all':f;['all','spp','bul','keh'].forEach(function(x){$('st-'+x).classList.toggle('on',x===F)});resetPage();renderList()}
function resetPage(){page=1}
function filtered(){
  var q=($('q').value||'').toLowerCase(),f1=$('fF').value,f2=$('fS').value,f3=$('fT').value,f4=$('fK').value;
  return A.filter(function(x){
    if(f1&&x.fuppi!==f1)return false;if(f2&&x.sekolah!==f2)return false;if(f3&&x.tingkat!==f3)return false;if(f4&&x.kelas!==f4)return false;
    if(F==='spp'&&!x.sppCount)return false;if(F==='bul'&&!x.buletinCount)return false;if(F==='keh'&&!x.kehadiranCount)return false;
    return !q||[x.id,x.nama,x.namaSumber,x.sekolah,x.fuppi,x.kelas,x.tingkat].join(' ').toLowerCase().indexOf(q)>=0;
  });
}
function renderList(){
  var a=filtered();$('cnt').textContent=a.length;
  var show=a.slice(0,page*PAGE);
  var h=show.map(function(x){
    var ch='';if(x.sppCount)ch+='<span class="chip s">SPP/Infaq</span>';if(x.buletinCount)ch+='<span class="chip b">Buletin</span>';if(x.kehadiranCount)ch+='<span class="chip k">Hadir '+x.kehadiranCount+'</span>';if(!x.terpetakan)ch+='<span class="chip x">Belum terpetakan</span>';
    return '<button class="person'+(cur&&cur.key===x.key?' sel':'')+'" data-k="'+esc(x.key)+'" onclick="openP(this.dataset.k)"><b>'+esc(x.nama)+'</b><div class="m">'+esc([x.id,x.sekolah,x.fuppi,x.kelas].filter(Boolean).join(' · '))+'</div><div class="dots">'+ch+'</div></button>';
  }).join('');
  if(a.length>show.length)h+='<button class="more" onclick="page++;renderList()">Tampilkan lebih banyak ('+(a.length-show.length)+')</button>';
  $('list').innerHTML=h||'<div class="empty">Tidak ditemukan</div>';
}
function openP(key){
  var x=A.filter(function(y){return y.key===key})[0];if(!x)return;
  cur=x;tabNow='ring';evFilter='Semua';evQ='';renderList();showP();
  if(window.innerWidth<=900)$('detail').scrollIntoView({behavior:'smooth'});
}
function sumInfaq(d){var t=0;d.sppAll.forEach(function(r){t+=r.total||0});return t}
function showP(){
  var x=cur,d=x.detail,p=d.profile;
  var bulOk=d.buletin.length?d.buletin[0]:null;
  var tags=[p.fuppi,p.sekolah,p.kelas,p.tingkat].filter(Boolean).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
  if(!x.terpetakan)tags='<span class="tag warn">Belum terpetakan ke Master D1 — hanya data SPP/Infaq</span>';
  $('detail').innerHTML='<div class="dh"><h2>'+esc(p.name||x.nama)+'</h2><div class="m">'+esc(p.id||'ID belum ada')+(x.namaSumber&&x.namaSumber!==p.name?' · nama di rekap: '+esc(x.namaSumber):'')+'</div><div class="tags">'+tags+'</div></div>'
  +'<div class="tiles">'
  +tile('spp','SPP',x.sppBulan+' bulan','tercatat di rekap')
  +tile('infaq','Infaq',rp(x.infaqTotal),x.infaqKali+' kali / program')
  +tile('bul','Buletin',bulOk?(bulOk.edisiTerisi?bulOk.edisiTerisi+' edisi':(bulOk.status||'Terdaftar')):'—',bulOk?('status: '+(bulOk.status||'-')):'tidak ada di Buku Kendali')
  +tile('keh','Kehadiran',d.kehadiran.events.length+' event',d.kehadiran.sm3||d.kehadiran.hadis?'ada ringkasan SM3/Hadis':'dari Database_SM')
  +'</div><div class="tabs" id="tabs"></div><div id="tabbox"></div>';
  drawTabs();drawTab();
}
function tile(t,l,n,dd){return '<button class="tile" onclick="goTab(\''+t+'\')"><div class="l">'+l+'</div><div class="n">'+esc(n)+'</div><div class="d">'+esc(dd)+'</div></button>'}
function goTab(t){tabNow=t;drawTabs();drawTab();$('tabs').scrollIntoView({behavior:'smooth',block:'nearest'})}
function drawTabs(){
  var d=cur.detail;
  var T=[['ring','Ringkasan',''],['spp','SPP',cur.sppBulan],['infaq','Infaq',cur.infaqKali],['bul','Buletin',d.buletin.length],['keh','Kehadiran',d.kehadiran.events.length]];
  $('tabs').innerHTML=T.map(function(t){return '<button class="tab'+(tabNow===t[0]?' on':'')+'" onclick="goTab(\''+t[0]+'\')">'+t[1]+(t[2]!==''?'<small>'+t[2]+'</small>':'')+'</button>'}).join('');
}
function drawTab(){
  var d=cur.detail,h='';
  if(tabNow==='ring')h=tRing(d);else if(tabNow==='spp')h=tSpp(d);else if(tabNow==='infaq')h=tInfaq(d);else if(tabNow==='bul')h=tBul(d);else h=tKeh(d);
  $('tabbox').innerHTML=h;
}
function tRing(d){
  var p=d.profile;
  return '<div class="sec"><h3>Sumber data & mapping</h3><div class="kv"><div><small>SPP/Infaq</small>'+esc(p.namaPendek||'-')+'</div><div><small>Buletin</small>'+esc(p.namaBuletin||'-')+'</div><div><small>Kehadiran</small>'+esc(p.namaKehadiran||'-')+'</div></div></div>'
  +'<div class="sec"><h3>Riwayat SPP<span>klik tab SPP untuk detail</span></h3>'+sppYears(d,true)+'</div>'
  +'<div class="sec"><h3>Infaq terbesar</h3>'+infaqBars(d,3)+'</div>';
}
function sppYears(d,mini){
  var rows=d.sppAll.filter(function(r){return r.tipe==='SPP'});
  if(!rows.length)return '<div class="muted note">Tidak ada baris SPP pada Rekap SPP.</div>';
  return rows.map(function(r){
    return '<div class="sec"><h3>'+esc(r.sumber)+'<span>'+(r.sppBulan||0)+' bulan tercatat'+(r.sppTerakhir?' · SPP terakhir: '+esc(r.sppTerakhir):'')+'</span></h3><div class="months">'
    +r.bulanList.map(function(m){return '<div class="mo'+(m.tanggal?' ok':'')+'" '+(m.tanggal?'data-t="'+esc(m.bulan+' '+r.tahun+' — dibayar '+m.tanggal)+'" onclick="showMn(this)" title="'+esc(m.tanggal)+'"':'')+'>'+esc(m.bulan.slice(0,3))+(m.tanggal?'<i>✓ '+esc(m.tanggal.slice(0,5))+'</i>':'')+'</div>'}).join('')
    +'</div></div>';
  }).join('')+(mini?'':'<div class="note" id="mn">Klik bulan berwarna hijau untuk melihat tanggal pembayaran.</div>');
}
function showMn(el){var n=$('mn');if(n)n.textContent=el.dataset.t}
function tSpp(d){return sppYears(d,false)}
function infaqBars(d,limit){
  var items=[];d.sppAll.forEach(function(r){if(r.tipe==='Infaq')(r.items||[]).forEach(function(i){items.push(i)})});
  items.sort(function(a,b){return b.nominal-a.nominal});
  if(!items.length)return '<div class="note">Belum ada infaq tercatat pada Rekap Infaq 26.</div>';
  var max=items[0].nominal||1;if(limit)items=items.slice(0,limit);
  return items.map(function(i){return '<div class="bar"><div>'+esc(i.nama)+'</div><div class="t"><i style="width:'+Math.max(3,Math.round(i.nominal/max*100))+'%"></i></div><div class="v">'+rp(i.nominal)+'</div></div>'}).join('');
}
function tInfaq(d){
  var rows=d.sppAll.filter(function(r){return r.tipe==='Infaq'});
  var total=0,fr='';rows.forEach(function(r){total+=r.total||0;if(r.frek)fr=r.frek});
  return '<div class="kv" style="margin-bottom:14px"><div><small>Total infaq</small><span class="big">'+rp(total)+'</span></div><div><small>Jumlah program / bulan</small><span class="big">'+cur.infaqKali+'</span></div><div><small>Frekuensi (rekap)</small><span class="big">'+esc(fr||'-')+'</span></div></div>'
  +'<div class="sec"><h3>Rincian per program<span>diurutkan dari nominal terbesar</span></h3>'+infaqBars(d,0)+'</div>';
}
function tBul(d){
  if(!d.buletin.length)return '<div class="note">Alumni ini tidak ditemukan di Buku Kendali (atau belum terpetakan ke Master D1).</div>';
  return d.buletin.map(function(b){
    var ok=b.status&&/aktif/i.test(b.status);
    var ed=(b.edisi||[]).length?'<div class="sec"><h3>Edisi diterima<span>'+b.edisiTerisi+' dari '+b.edisi.length+' edisi</span></h3><div class="ed">'+b.edisi.map(function(e){var f=e.nilai&&e.nilai!=='-';return '<div class="e'+(f?' ok':'')+'" title="Edisi '+e.no+(e.nilai?': '+esc(e.nilai):'')+'">'+e.no+'</div>'}).join('')+'</div></div>':'<div class="note">Kolom edisi 1–52 tidak terbaca dari Buku Kendali.</div>';
    return '<div class="kv" style="margin-bottom:14px"><div><small>Status</small><span class="pill '+(ok?'ok':'no')+'">'+esc(b.status||'-')+'</span></div><div><small>FUPPI</small>'+esc(b.fuppi||'-')+'</div><div><small>Petugas</small>'+esc(b.petugas||'-')+'</div><div><small>Karir</small>'+esc(b.karir||'-')+'</div><div><small>Edisi terakhir</small>'+esc(b.edisiTerakhir||'-')+'</div><div><small>Sumber</small>'+esc(b.sumber)+'</div></div>'+ed;
  }).join('');
}
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function pd(s){var m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(String(s||'').trim());if(!m)return 0;var y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
var MN=['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'],ML=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function monthIdx(k){k=String(k).toLowerCase().slice(0,3);if(k==='may')return 4;if(k==='aug')return 7;if(k==='oct')return 9;if(k==='dec')return 11;return MN.indexOf(k)}
function tKeh(d){
  var k=d.kehadiran,ev=k.events.slice().sort(evCmp);
  var h='';
  if(k.participant)h+='<div class="kv" style="margin-bottom:14px"><div><small>Peserta (Database_Peserta)</small>'+esc(k.participant.nama)+'</div><div><small>Tingkatan</small>'+esc(k.participant.tingkat||'-')+'</div><div><small>Sekolah</small>'+esc(k.participant.sekolah||'-')+'</div></div>';
  var per=[];for(var i=0;i<12;i++)per.push(0);var from='dari Database_SM';
  if(!ev.length&&k.sm3){var any=false;Object.keys(k.sm3).forEach(function(key){var i=monthIdx(key);if(i>=0&&/^[a-z]{3,}/i.test(key)){var v=parseInt(k.sm3[key],10);if(!isNaN(v)){per[i]=v;any=true}}});if(any)from='dari Kehadiran_SM3'}
  if(from==='dari Database_SM')ev.forEach(function(e){var i=monthIdx(e.bulan);if(i<0){if(e.tanggalIso)i=+e.tanggalIso.slice(5,7)-1}if(i>=0)per[i]++});
  var mx=Math.max.apply(null,per.concat([1]));
  h+='<div class="sec"><h3>Kehadiran per bulan<span>'+from+(from==='dari Database_SM'?' · total '+ev.length:(k.sm3&&k.sm3.Total!=null?' · total '+esc(k.sm3.Total):''))+'</span></h3><div class="chart">'+per.map(function(v,i){return '<div><b>'+(v||'')+'</b><i style="height:'+Math.round(v/mx*70)+'px"></i>'+ML[i]+'</div>'}).join('')+'</div></div>';
  if(k.hadis){
    var tm=[];Object.keys(k.hadis).forEach(function(key){var m=/^TM\s*(\d+)$/i.exec(key);if(m)tm.push([+m[1],k.hadis[key]])});tm.sort(function(a,b){return a[0]-b[0]});
    h+='<div class="sec"><h3>Kehadiran Hadis<span>'+esc(k.hadis['Hadir Hadis']!=null?k.hadis['Hadir Hadis']+' hadir':'')+(k.hadis['% Hadis']?' · '+esc(k.hadis['% Hadis']):'')+(k.hadis.Status?' · '+esc(k.hadis.Status):'')+'</span></h3>'
    +(tm.length?'<div class="ed" style="grid-template-columns:repeat(11,1fr)">'+tm.map(function(t){var f=t[1]!==''&&t[1]!=null&&String(t[1]).trim()!=='-'&&String(t[1]).trim()!=='0';return '<div class="e'+(f?' ok':'')+'" title="TM'+t[0]+(t[1]?': '+esc(t[1]):'')+'">'+t[0]+'</div>'}).join('')+'</div>':'')+'</div>';
  }
  var progs={};ev.forEach(function(e){if(e.program)progs[e.program]=1});
  var pl=['Semua'].concat(Object.keys(progs).sort());
  h+='<div class="sec"><h3>Riwayat kehadiran<span>'+ev.length+' event · '+(evAsc?'terlama':'terbaru')+' dulu · klik untuk membuka materi</span></h3>';

/* ===== MATERI SM (semua FUPPI) ===== */
var MAT={cat:'',y:'',open:{},asc:false};
function mNorm(s){return String(s||'').toLowerCase().replace(/&/g,' dan ').replace(/['’`]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function mSim(a,b){var A=a.split(' '),B=b.split(' '),sa={},n=0,u;A.forEach(function(w){sa[w]=1});var sb={};B.forEach(function(w){sb[w]=1;if(sa[w])n++});u=Object.keys(sa).length+Object.keys(sb).length-n;return u?n/u:1}
function mCat(x){var p=String(x.program||'').toLowerCase();if(p==='hadis'||p==='hadist'||p==='hadits')return 'Hadis';if(p==='ekstra')return 'SM Ekstra';var m=String(x.materi||'').trim().toUpperCase();return m||String(x.program||'Lainnya')}
function mIso(ts){return ts?new Date(ts).toISOString().slice(0,10):''}
function mFmt(iso){var p=iso.split('-');return (+p[2])+' '+ML[+p[1]-1]+' '+p[0]}
function mCats(){
  var rows=(REK.sm||[]),c={};
  rows.forEach(function(x){var k=mCat(x);c[k]=(c[k]||0)+1});
  var ks=Object.keys(c),top=['Hadis','SM Ekstra'].filter(function(k){return c[k]});
  return top.concat(ks.filter(function(k){return top.indexOf(k)<0}).sort(function(a,b){return c[b]-c[a]})).map(function(k){return {k:k,n:c[k]}});
}
function mSessions(cat,yr){
  var rows=(REK.sm||[]).filter(function(x){return mCat(x)===cat&&x.ts&&(!yr||String(x.y)===yr)}).sort(function(a,b){return a.ts-b.ts});
  var groups={},list=[];
  rows.forEach(function(x){
    var tm=String(x.tm==null?'':x.tm).trim(),hasTm=/^\d+$/.test(tm),last=null;
    if(hasTm){
      var base='t|'+mNorm(x.materi)+'|'+parseInt(tm,10),arr=groups[base]=groups[base]||[];last=arr[arr.length-1];
      if(!last||x.ts-last.max>7*86400000){last={max:x.ts,min:x.ts,tm:parseInt(tm,10),rows:[]};arr.push(last);list.push(last)}
    }else{
      // tanpa TM: tanggal harus sama persis; pembahasan dianggap sama bila teksnya sama setelah dirapikan (& = dan, tanda baca dibuang) atau hampir identik (>=85% kata sama)
      var nm=mNorm(x.pb)||mNorm(x.materi),arr2=groups['d|'+x.ts]=groups['d|'+x.ts]||[];
      for(var i=0;i<arr2.length&&!last;i++)if(arr2[i].nm===nm||mSim(arr2[i].nm,nm)>=0.85)last=arr2[i];
      if(!last){last={max:x.ts,min:x.ts,tm:null,nm:nm,rows:[]};arr2.push(last);list.push(last)}
    }
    last.max=x.ts;last.rows.push(x);
  });
  list.forEach(function(s){
    var cnt={},best='';
    s.rows.forEach(function(x){var t=String(x.pb||'').replace(/\s+/g,' ').trim();if(t){cnt[t]=(cnt[t]||0)+1;if(cnt[t]>(cnt[best]||0))best=t}});
    s.title=best||String(s.rows[0].materi||'').trim()||'(tanpa pembahasan)';
    s.f={};s.rows.forEach(function(x){var f=x.fuppi||'Tanpa FUPPI';var o=s.f[f]=s.f[f]||{};var k=x.id||mNorm(x.nama);if(!o[k])o[k]={n:x.nama,t:x.tingkat}});
    s.total=0;Object.keys(s.f).forEach(function(f){s.total+=Object.keys(s.f[f]).length});
  });
  list.sort(function(a,b){return MAT.asc?a.min-b.min:b.min-a.min});
  return list;
}
function mSet(k,v){MAT[k]=v;if(k==='cat')MAT.open={};drawMateri()}

   +'<button class="fc" onclick="mSet(\'asc\','+(!MAT.asc)+')">'+(MAT.asc?'Terlama dulu':'Terbaru dulu')+'</button></div>'
   +'<div class="rn" style="margin-bottom:6px">'+L.length+' pertemuan · '+tot+' kehadiran. Pertemuan digabung bila tanggal dan pembahasannya sama (selisih penulisan kecil seperti & / dan, tanda baca, atau huruf besar dianggap sama). Materi bernomor TM digabung bila TM-nya sama dalam rentang 7 hari. Klik kartu untuk melihat nama.</div>';
  h+=L.map(function(s,i){

     +'<div class="fl">'+fk.map(function(f){return '<span>'+esc(f)+' <b>'+Object.keys(s.f[f]).length+'</b></span>'}).join('')+'</div>';
    if(MAT.open[i])o+='<div class="nm">'+fk.map(function(f){var a=Object.keys(s.f[f]).map(function(k){return s.f[f][k]}).sort(function(a,b){return a.n<b.n?-1:1});return '<div><b>'+esc(f)+'</b> ('+a.length+'): '+a.map(function(x){return esc(x.n)+(x.t?' <i>'+esc(x.t)+'</i>':'')}).join(', ')+'</div>'}).join('')+'</div>';
    return o+'</div>';

      s+='<td class="c'+on(k,i)+'"'+st+' title="'+esc(o.tip?o.tip(v):v)+'" data-f="'+esc(k)+'" data-m="'+i+'" onclick="pick(this)">'+(v>0?esc(o.fmt(v)):'·')+'</td>';
    });

/* ---- SPP: khusus Nonsos & Staf Pusat ---- */
function rSpp(){
  var all=REK.spp||[];
  var yrs=uniq(all.map(function(x){return x.tahun})).sort();
  var inY=all.filter(function(x){return x.tahun===R.tahun});
  var kc={};inY.forEach(function(x){kc[x.karir]=(kc[x.karir]||0)+1});
  var ctl='<div class="tools">'+yrs.map(function(y){return chip('Tahun '+y,R.tahun===y,'setTahun',y)}).join('')+'</div>'
    +'<div class="tools">'+Object.keys(R.karir).sort().map(function(k){return chip(k+' · '+(kc[k]||0),R.karir[k],'togKarir',k)}).join('')+'</div>';
  var rows=inY.filter(function(x){return R.karir[x.karir]});
  var g={};rows.forEach(function(x){var o=g[x.fuppi]||(g[x.fuppi]={n:0,v:zeros()});o.n++;x.bulan.forEach(function(b,i){if(b)o.v[i]++})});
  var fl=Object.keys(g).sort(fSort),tv=zeros(),tn=0;
  var trs=fl.map(function(f){var o=g[f];tn+=o.n;o.v.forEach(function(v,i){tv[i]+=v});return {f:f,den:o.n,lead:[o.n],vals:o.v,trail:[{t:String(sum(o.v)),m:-1}]}});
  var off=Object.keys(R.karir).filter(function(k){return !R.karir[k]&&kc[k]}).map(function(k){return k+' ('+kc[k]+')'});

  var tb=tbl({leadH:['Alumni'],trailH:['Σ bulan'],rows:trs,total:{f:'Semua FUPPI',lead:[tn],vals:tv,trail:[{t:String(sum(tv)),m:-1}]},fmt:String,note:note});
  return {ctl:ctl,tbl:tb,drill:drillSpp(rows)};
}
function drillSpp(rows){

    +fl.map(function(f){var o=g[f];return '<tr><th class="f">'+esc(f)+'</th>'+pl.map(function(p){var v=o.pp[p]||0;return '<td title="'+esc(rp(v))+'">'+(v?esc(rpc(v)):'·')+'</td>'}).join('')+'<td><b>'+esc(rpc(o.prog))+'</b></td></tr>'}).join('')

function drillInfaq(){

function smRows(){return (REK.sm||[]).filter(function(x){return String(x.y)===R.ySm&&R.prog[x.program]&&R.ting[x.tingkat]&&x.bulan>0})}
function rHadir(){
  var S=REK.sm||[];
  var ys=uniq(S.map(function(x){return String(x.y)})).sort();if(ys.length>1)ys=ys.filter(function(y){return y!=='0'});
  var ps=uniq(S.map(function(x){return x.program})).sort(),ts=uniq(S.map(function(x){return x.tingkat})).sort();
  var ctl='';
  if(ys.length>1)ctl+='<div class="tools">'+ys.map(function(y){return chip('Tahun '+y,R.ySm===y,'setYsm',y)}).join('')+'</div>';
  ctl+='<div class="tools">'+chip('Jumlah kehadiran',R.metrik==='hadir','setMetrik','hadir')+chip('Peserta unik',R.metrik==='unik','setMetrik','unik')+'</div>';
  ctl+='<div class="tools">'+ps.map(function(p){return chip(p,R.prog[p],'togProg',p)}).join('')+'<span style="width:10px"></span>'+ts.map(function(p){return chip(p,R.ting[p],'togTing',p)}).join('')+'</div>';
  var rows=smRows(),uk=R.metrik==='unik';
  var g={},gu=[{},{},{},{},{},{},{},{},{},{},{},{}],gy={},gc=zeros();
  rows.forEach(function(x){
    var o=g[x.fuppi]||(g[x.fuppi]={c:zeros(),u:[{},{},{},{},{},{},{},{},{},{},{},{}],uy:{}}),i=x.bulan-1,k=x.nama.toLowerCase();
    o.c[i]++;o.u[i][k]=1;o.uy[k]=1;gc[i]++;gu[i][k]=1;gy[k]=1;
  });
  var fl=Object.keys(g).sort(fSort);
  var trs=fl.map(function(f){var o=g[f];
    var vals=uk?o.u.map(function(u){return Object.keys(u).length}):o.c;
    return {f:f,lead:[],vals:vals,trail:[{t:String(uk?Object.keys(o.uy).length:sum(o.c)),m:-1}]};});
  var tv=uk?gu.map(function(u){return Object.keys(u).length}):gc;
  var nTanpa=S.filter(function(x){return !x.bulan}).length;
  var note='Sumber: Database_SM, dihitung per FUPPI pada baris tiap kehadiran ('+rows.length+' baris terhitung). '+(uk?'Peserta unik = nama berbeda dalam bulan/tahun itu.':'Satu peserta yang hadir di satu pertemuan dihitung 1.')+' Klik angka untuk melihat nama.'+(nTanpa?' '+nTanpa+' baris tanpa bulan tidak ikut dihitung.':'');
  var tb=tbl({leadH:[],trailH:[uk?'Peserta (setahun)':'Total'],rows:trs,total:{f:'Semua FUPPI',lead:[],vals:tv,trail:[{t:String(uk?Object.keys(gy).length:sum(gc)),m:-1}]},fmt:String,note:note});
  return {ctl:ctl,tbl:tb,drill:drillHadir(rows)};
}
function drillHadir(rows){

  var nm=Object.keys(c).sort(function(a,b){return c[b]-c[a]||(a<b?-1:1)});

  return '<div class="drill"><h4>'+esc(tt)+' — '+ev+' kehadiran dari '+nm.length+' peserta</h4><div class="chips">'
    +(nm.map(function(n){return '<span class="chip k">'+esc(n)+(c[n]>1?' ×'+c[n]:'')+'</span>'}).join('')||'<span class="rn">Belum ada.</span>')+'</div></div>';

/* Kehadiran SM: per bulan (jumlah) atau per pertemuan (tanggal, tanda v) */
var MON3=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function smYears(L){var o={};(L.sm||[]).forEach(function(x){if(x.y)o[x.y]=1});return Object.keys(o).sort()}
function smVals(L,k){var o={};(L.sm||[]).forEach(function(x){o[x[k]]=1});return Object.keys(o).sort()}
function smInit(L){
  var ys=smYears(L);if(ys.indexOf(String(LSM.y))<0)LSM.y=ys[ys.length-1]||'';
  smVals(L,'p').forEach(function(p){if(LSM.prog[p]===undefined)LSM.prog[p]=true});
  smVals(L,'t').forEach(function(p){if(LSM.ting[p]===undefined)LSM.ting[p]=true});
}
function modelSm(L){
  smInit(L);

  var P={},order=[];
  rows.forEach(function(x){var k=x.id||x.n.toLowerCase();if(!P[k]){P[k]={n:x.n,t:x.t,c:zeros(),d:{}};order.push(k)}P[k].c[x.b-1]++;P[k].d[x.ts]=1});
  order.sort(function(a,b){return P[a].n<P[b].n?-1:1});

  var hdr='#d9e8d0';
  if(LSM.mode==='bulan'){
    var foot=['TOTAL','',].concat(MON3.map(function(m,i){return sumArr(ppl.map(function(p){return p.c[i]}))||''})).concat([sumArr(ppl.map(function(p){return sumArr(p.c)}))]);
    return {name:'Kehadiran SM '+LSM.y,bands:null,head:['No','Nama','Tingkat'].concat(MON3).concat(['Total']),
      rows:ppl.map(function(p,i){return [i+1,p.n,p.t||''].concat(p.c.map(function(v){return v||''})).concat([sumArr(p.c)])}),
      foot:[''].concat(foot),freeze:2,hdr:hdr,hfg:'#222',mf:null,w:[5,28,9]};
  }
  var dts={};rows.forEach(function(x){dts[x.ts]=x.b});
  var tl=Object.keys(dts).map(Number).sort(function(a,b){return a-b});
  var bands=[{label:'',span:3}],last='',bl=[];
  tl.forEach(function(ts){bl.push(MON3[new Date(ts).getUTCMonth()])});
  ngroup(bl).forEach(function(g){bands.push(g)});bands.push({label:'',span:1});
  return {name:'Kehadiran SM '+LSM.y,bands:bands,head:['No','Nama','Tingkat'].concat(tl.map(function(ts){var d=new Date(ts);return d.getUTCDate()+'/'+(d.getUTCMonth()+1)})).concat(['Total']),
    rows:ppl.map(function(p,i){return [i+1,p.n,p.t||''].concat(tl.map(function(ts){return p.d[ts]?'v':''})).concat([Object.keys(p.d).length])}),
    foot:null,freeze:2,hdr:hdr,hfg:'#222',mark:3,mf:null,w:[5,28,9]};
}

/* Unduh tampilan tabel aktif sebagai gambar PNG (digambar langsung, tanpa tangkapan layar). */
function dlPng(){
  var L=LEM[LF];if(!L)return;
  var T=tabsOf(L),m=modelFor(L,LT);
  if(!m.rows.length){alert('Belum ada data untuk digambar.');return}
  var S=2,FS=13,PADX=9,RH=24,F='Calibri, Carlito, Arial, sans-serif';
  var cv=document.createElement('canvas'),g=cv.getContext('2d');
  g.font=FS+'px '+F;
  var nc=m.head.length,W=[];
  function cellText(c,i,foot){var num=m.mf&&m.mf[i]&&c!=='';return num?cellRp(c):String(c==null?'':c)}
  for(var i=0;i<nc;i++){
    g.font='bold '+FS+'px '+F;var w=g.measureText(String(m.head[i])).width;
    g.font=FS+'px '+F;
    m.rows.forEach(function(r){w=Math.max(w,g.measureText(cellText(r[i],i)).width)});
    if(m.foot)w=Math.max(w,g.measureText(cellText(m.foot[i],i)).width+6);
    W.push(Math.ceil(w)+PADX*2);
    if(m.mark!==undefined&&i>=m.mark)W[i]=Math.max(28,W[i]-PADX);
  }
  var tw=sumArr(W),M=14,TH=34,bandRows=m.bands?1:0;
  var title='FUPPI '+LF+' · '+((T.filter(function(t){return t[0]===LT})[0]||['',''])[1])+(LU?' · per '+LU:'');
  g.font='bold 17px '+F;var minW=g.measureText(title).width+M*2;
  var cw=Math.max(tw+M*2,minW),ch=TH+(1+bandRows+m.rows.length+(m.foot?1:0))*RH+M;
  cv.width=cw*S;cv.height=ch*S;g=cv.getContext('2d');g.scale(S,S);
  g.fillStyle='#fff';g.fillRect(0,0,cw,ch);
  g.textBaseline='middle';g.fillStyle='#1f2a44';g.font='bold 17px '+F;g.textAlign='left';g.fillText(title,M,M+8);
  var x0=M,y=TH,line='#c9ccd1',bandCol=['#e8eef8','#e6f4ea','#eaf6e0','#fff4d6','#fde9d9','#e7e6f7'];
  function box(x,yy,w,h,fill){if(fill){g.fillStyle=fill;g.fillRect(x,yy,w,h)}g.strokeStyle=line;g.lineWidth=1;g.strokeRect(x+.5,yy+.5,w,h)}
  function txt(t,x,yy,w,al,font,col){g.font=font;g.fillStyle=col;g.textAlign=al;var tx=al==='center'?x+w/2:al==='right'?x+w-PADX:x+PADX;g.fillText(t,tx,yy+RH/2+1)}
  if(m.bands){
    var x=x0,ci=0;
    m.bands.forEach(function(b,bi){var w=0,k;for(k=0;k<b.span;k++)w+=W[ci+k];box(x,y,w,RH,bandCol[bi%6]);txt(b.label,x,y,w,'center','bold '+FS+'px '+F,'#222');x+=w;ci+=b.span});
    y+=RH;

var IMP={file:'',payload:null,pv:null,busy:false,msg:'',err:'',op:''};

function impIso(v){
  if(typeof v==='number'&&v>30000&&v<80000){return new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10)}
  if(v instanceof Date&&!isNaN(v)){return v.getFullYear()+'-'+('0'+(v.getMonth()+1)).slice(-2)+'-'+('0'+v.getDate()).slice(-2)}
  return String(v==null?'':v).trim();
}
function impSheet(wb,name){
  var k=Object.keys(wb.Sheets).filter(function(n){return n.toLowerCase().replace(/[^a-z_]/g,'')===name.toLowerCase()})[0];
  return k?wb.Sheets[k]:null;
}
function impRows(ws,need){
  var a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),hi=-1,i,j;
  for(i=0;i<Math.min(a.length,10)&&hi<0;i++){
    var cells=a[i].map(function(x){return String(x).trim().toLowerCase()});
    if(need.every(function(k){return cells.indexOf(k)>=0}))hi=i;
  }
  if(hi<0)return null;
  var h={};a[hi].forEach(function(x,c){var k=String(x).trim().toLowerCase();if(k&&h[k]===undefined)h[k]=c});
  return {h:h,rows:a.slice(hi+1)};

function impRead(f){
  IMP.msg='';IMP.err='';IMP.pv=null;IMP.payload=null;IMP.file=f?f.name:'';
  if(!f){drawImp();return}
  if(!window.XLSX){IMP.err='Pustaka pembaca Excel belum termuat. Muat ulang halaman lalu coba lagi.';return drawImp()}
  IMP.busy=true;drawImp();
  var rd=new FileReader();
  rd.onerror=function(){IMP.busy=false;IMP.err='File tidak bisa dibaca.';drawImp()};
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var wsS=impSheet(wb,'Database_SM'),wsP=impSheet(wb,'Database_Peserta');
      if(!wsS)throw new Error('Sheet "Database_SM" tidak ada di file ini.');
      var s=impRows(wsS,['nama','tanggal','tm']);
      if(!s)throw new Error('Header Database_SM tidak dikenali (butuh kolom Nama, Tanggal, TM).');
      var g=function(r,k){var c=s.h[k];return c===undefined?'':r[c]};
      var sm=s.rows.map(function(r){return {f:g(r,'fuppi'),n:g(r,'nama'),t:g(r,'tingkatan'),m:g(r,'materi'),pb:g(r,'pembahasan'),tm:g(r,'tm'),tg:impIso(g(r,'tanggal')),pr:g(r,'program'),b:g(r,'bulan')}})
        .filter(function(x){return String(x.n).trim()||String(x.m).trim()||String(x.tg).trim()});
      var ps=[];
      if(wsP){var p=impRows(wsP,['nama','fuppi']);if(p){var q=function(r,k){var c=p.h[k];return c===undefined?'':r[c]};
        ps=p.rows.map(function(r){return {f:q(r,'fuppi'),n:q(r,'nama'),t:q(r,'tingkatan'),s:q(r,'asal sekolah')}}).filter(function(x){return String(x.n).trim()})}}
      IMP.payload={sm:sm,ps:ps,file:f.name};
      kwCall('previewImporSM',IMP.payload,function(pv){IMP.busy=false;IMP.pv=pv;drawImp()},function(m){IMP.busy=false;IMP.err=m;drawImp()});
    }catch(e){IMP.busy=false;IMP.err=(e&&e.message)||String(e);drawImp()}
  };
  rd.readAsArrayBuffer(f);
}

function kwCall(fn,arg,ok,fail){
  var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){
    var m=e&&e.message?e.message:String(e);
    if(m==='PIN'||/(^|[^a-z])PIN$/.test(m)){var p=prompt(PIN?'PIN salah. Masukkan PIN admin:':'Masukkan PIN admin:');if(p!==null){PIN=p;try{sessionStorage.setItem('pin',p)}catch(x){}return kwCall(fn,arg,ok,fail)}}
    fail(m.replace(/^Error:\s*/,''));
  });
  if(arg===null)r[fn](PIN);else if(Array.isArray(arg))r[fn].apply(r,arg.concat([PIN]));else r[fn](arg,PIN);
}
function kwLoad(){KW.err='';KW.d=null;drawKw();kwCall('getKuitansiInit',null,function(d){KW.d=d;drawKw()},function(m){KW.err=m;drawKw()})}
function kwV(id){var e=$(id);return e?e.value:''}

    spp:parseInt(kwV('k_spp'),10)||0,sppTahun:kwV('k_th'),sppTahunSampai:kwV('k_th2'),sppDari:kwV('k_b1'),sppSampai:kwV('k_b2'),infaq:parseInt(kwV('k_inf'),10)||0,

}
function kwNorm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function kwHas(sheet,n){var L=(KW.d&&KW.d.names[sheet])||null;if(!L)return null;var k=kwNorm(n);return L.some(function(x){return kwNorm(x)===k})}
function kwHint(){
  if(!KW.d)return;
  var tg=kwV('k_tgl'),yy=tg?tg.slice(2,4):'',y1=+kwV('k_th')||0,y2=+kwV('k_th2')||y1,spp=parseInt(kwV('k_spp'),10)||0,inf=parseInt(kwV('k_inf'),10)||0;
  [['k_n1','kwh1',1],['k_n2','kwh2',0]].forEach(function(a){
    var n=kwV(a[0]).trim(),el=$(a[1]);if(!el)return;
    if(!n||n==='-'){el.textContent='';el.className='hint';return}
    var miss=[];
    if(spp>0){for(var yr=y1;yr<=y2&&yr<=y1+3;yr++){var sy=String(yr).slice(2),r=kwHas('Rekap SPP '+sy,n);if(r===false)miss.push('Rekap SPP '+sy);if(r===null)miss.push('(Rekap SPP '+sy+' tidak ada)')}}
    if(a[2]&&inf>0){var r2=kwHas('Rekap Infaq '+yy,n);if(r2===false)miss.push('Rekap Infaq '+yy);if(r2===null)miss.push('(Rekap Infaq '+yy+' tidak ada)')}
    if(miss.length){el.className='hint bad';el.textContent='Belum ada di: '+miss.join(', ')+' → centang "Buat baris baru" bila memang baru'}
    else{el.className='hint ok';el.textContent='✓ ada di rekap'}
  });
  var tot=spp+inf,k1=spp&&inf?'SPP & Infaq':spp?'SPP':inf?'Infaq':'-';
  var t=$('kwtot');if(t)t.textContent='Nominal total: '+rp(tot)+'  ·  Ket 1: '+k1;
  var th=$('kwsppn');
  if(th){var b1=+kwV('k_b1'),b2=+kwV('k_b2'),n=(y2*12+b2)-(y1*12+b1)+1;th.textContent=(spp>0&&b1&&b2&&n>=1)?n+' bulan'+(y2>y1?' (lintas tahun, otomatis dibagi ke sheet tiap tahun)':'')+' · rata-rata '+rp(spp/n)+' / bulan':(spp>0&&n<1?'Periode SPP terbalik: "dari" harus sebelum "sampai"':'')}
}

function kwPlanHtml(r){
  var h='<div class="pv">';

function kwCheck(){
  if(KW.busy)return;kwSave0();KW.msg='';KW.err='';KW.pv=null;KW.busy=true;drawKw(true);
  kwCall('previewKuitansi',kwCollect(),function(r){KW.busy=false;KW.pv=r;drawKw(true)},function(m){KW.busy=false;KW.err=m;drawKw(true)});

  if(KW.busy)return;kwSave0();KW.msg='';KW.err='';KW.pv=null;

    if(r.errors&&r.errors.length){KW.busy=false;KW.pv=r;drawKw(true);return}

      KW.busy=false;KW.msg='Tersimpan.\n'+res.done.join('\n');

   +'<div><label>SPP (Rp)</label><input type="number" id="k_spp" min="0" step="1000" value="'+esc(dr.spp||'')+'" placeholder="0"></div>'
